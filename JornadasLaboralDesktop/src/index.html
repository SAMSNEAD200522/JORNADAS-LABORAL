<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Jornadas Laborales</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
        }
        .loading-container {
            text-align: center;
            max-width: 400px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #1976d2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { font-size: 1.5rem; margin-bottom: 12px; color: #1565c0; }
        p { color: #666; margin-bottom: 8px; }
        .status { font-size: 0.9rem; color: #888; }
        .error { color: #c62828; display: none; }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <h1>Control de Jornadas Laborales</h1>
        <p>Iniciando servidor backend...</p>
        <p class="status" id="status">Esperando a que el servidor este disponible</p>
        <p class="error" id="error">Error al conectar con el servidor</p>
    </div>
    <script>
        (function() {
            var statusEl = document.getElementById('status');
            var errorEl = document.getElementById('error');
            var attempts = 0;
            var maxAttempts = 60;
            var backendPort = 3000;
            var backendUrl = 'http://localhost:' + backendPort;

            function checkBackend() {
                attempts++;
                statusEl.textContent = 'Intento ' + attempts + '/' + maxAttempts + '...';

                var xhr = new XMLHttpRequest();
                xhr.open('GET', backendUrl + '/api/v1/health', true);
                xhr.timeout = 2000;
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        statusEl.textContent = 'Servidor listo. Redirigiendo...';
                        setTimeout(function() {
                            window.location.href = backendUrl;
                        }, 500);
                    } else {
                        retry();
                    }
                };
                xhr.onerror = function() { retry(); };
                xhr.ontimeout = function() { retry(); };
                xhr.send();
            }

            function retry() {
                if (attempts >= maxAttempts) {
                    statusEl.style.display = 'none';
                    errorEl.style.display = 'block';
                    errorEl.textContent = 'No se pudo conectar al servidor en ' + maxAttempts + ' intentos.';
                    return;
                }
                setTimeout(checkBackend, 1000);
            }

            checkBackend();
        })();
    </script>
</body>
</html>
